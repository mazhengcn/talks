[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "24"
PLAYWRIGHT_BROWSERS_PATH = "0"

[[redirects]]
from = "/2025/hksiam/*"
to = "/2025/hksiam/index.html"
status = 200

[[redirects]]
from = "/2025/csiam-bdai/*"
to = "/2025/csiam-bdai/index.html"
status = 200

[[redirects]]
from = "/2025/cmcms/*"
to = "/2025/cmcms/index.html"
status = 200

[[redirects]]
from = "/2025/shsiam/*"
to = "/2025/shsiam/index.html"
status = 200
