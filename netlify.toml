
[build]
publish = "dist"
command = "bun --bun run build"

# CORS headers for metadata API
[[headers]]
for = "/talks-metadata.json"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, OPTIONS"
Access-Control-Allow-Headers = "Content-Type"
Cache-Control = "public, max-age=3600"


[[redirects]]
from = "/2025-07-10/pdf"
to = "https://github.com/mazhengcn/talks/blob/main/talks/2025-07-10/assets/2025-07-10-hksiam-en.pdf?raw=true"
status = 302

[[redirects]]
from = "/2025-07-10/src"
to = "https://github.com/mazhengcn/talks/tree/main/talks/2025-07-10"
status = 302

[[redirects]]
from = "/2025-07-10/*"
to = "/2025-07-10/index.html"
status = 200

